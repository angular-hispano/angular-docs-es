<div class="two-column-step">
  <div class="step-description">
    <div class="header">Signals: Reactividad de Grano Fino</div>
    <div class="description">
      Escribe en el cuadro de búsqueda para filtrar la lista. Un signal
      <code>computed</code> recalcula automáticamente
      <code>filteredItems</code> cada vez que el signal <code>searchTerm</code> cambia.
    </div>

    <div class="demo-display">
      <input
        [value]="searchTerm()"
        (input)="onSearch($event.target.value)"
        placeholder="Busca una fruta..."
        class="demo-input"
      />
      <div class="demo-list">
        @for (item of filteredItems(); track item) {
          <div class="demo-item">{{ item }}</div>
        }
      </div>
    </div>

    <button
      class="docs-primary-btn"
      [attr.text]="'Aprende más sobre signals'"
      routerLink="/guide/signals"
    >
      Aprende más sobre signals
    </button>
  </div>

  <div class="step-code">
    <div class="code-block">
      <div class="code-header">
        <span>component.ts</span>
        <span class="copy-icon"></span>
      </div>

      <adev-code-block [code]="tsExample" />
    </div>

    <div class="code-block">
      <div class="code-header">
        <span>component.html</span>
        <span class="copy-icon"></span>
      </div>
      <adev-code-block [code]="htmlExample" language="angular-html" />
    </div>
  </div>
</div>
