<div class="two-column-step">
  <div class="step-description">
    <div class="header">Vistas Diferibles</div>
    <div class="description">
      Las vistas diferibles (también conocidas como bloques <code>&#64;defer</code>) reducen el
      tamaño inicial del bundle de tu aplicación al diferir la carga de código que no es
      estrictamente necesario para el renderizado inicial de una página.
    </div>

    <button
      class="docs-primary-btn"
      [attr.text]="'Aprende más sobre la carga diferida'"
      routerLink="/guide/templates/defer"
    >
      Aprende más sobre la carga diferida
    </button>
  </div>

  <div class="step-code">
    <div class="code-block">
      <div class="code-header">
        <span>data-visualization-page.html</span>
        <span class="copy-icon"></span>
      </div>

      <adev-code-block [code]="exampleHtml" language="angular-html" />
    </div>

    <div class="code-block">
      <div class="code-header">
        <span>data-visualization-page.ts</span>
        <span class="copy-icon"></span>
      </div>

      <adev-code-block [code]="exampleTs" />
    </div>
  </div>
</div>
